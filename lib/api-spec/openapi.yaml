openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: characters
    description: Anime character operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /characters:
    get:
      operationId: listCharacters
      tags: [characters]
      summary: List all anime characters
      description: Returns the full list of anime characters with their attributes
      responses:
        "200":
          description: List of characters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Character"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Character:
      type: object
      required:
        - id
        - name
        - anime
        - gender
        - hairColor
        - eyeColor
        - ageRange
        - species
        - powers
        - alignment
        - role
      properties:
        id:
          type: string
        name:
          type: string
        anime:
          type: string
        gender:
          type: string
        hairColor:
          type: string
        eyeColor:
          type: string
        ageRange:
          type: string
        species:
          type: string
        powers:
          type: array
          items:
            type: string
        alignment:
          type: string
        role:
          type: string

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
