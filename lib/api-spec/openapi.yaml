openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: characters
    description: Anime character operations
  - name: rooms
    description: Game room operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /characters:
    get:
      operationId: listCharacters
      tags: [characters]
      summary: List all anime characters
      description: Returns the full list of anime characters with their attributes
      responses:
        "200":
          description: List of characters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Character"

  /rooms:
    post:
      operationId: createRoom
      tags: [rooms]
      summary: Create a game room
      description: Creates a new private game room and returns a join code
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomInput"
      responses:
        "201":
          description: Room created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"

  /rooms/{code}:
    get:
      operationId: getRoom
      tags: [rooms]
      summary: Get room info
      description: Returns current state of a game room by its join code
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Room info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "404":
          description: Room not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Character:
      type: object
      required:
        - id
        - name
        - anime
        - gender
        - hairColor
        - eyeColor
        - ageRange
        - species
        - powers
        - alignment
        - role
      properties:
        id:
          type: string
        name:
          type: string
        anime:
          type: string
        gender:
          type: string
        hairColor:
          type: string
        eyeColor:
          type: string
        ageRange:
          type: string
        species:
          type: string
        powers:
          type: array
          items:
            type: string
        alignment:
          type: string
        role:
          type: string

    RoomInput:
      type: object
      properties:
        hostName:
          type: string

    Room:
      type: object
      required:
        - code
        - phase
        - playerCount
      properties:
        code:
          type: string
        phase:
          type: string
        playerCount:
          type: number
        hostName:
          type: ["string", "null"]

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
